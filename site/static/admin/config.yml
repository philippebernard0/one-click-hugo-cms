backend:
  name: git-gateway
  branch: main

media_folder: "site/static/img" # Folder where user uploaded files should go
public_folder: "/img"

collections: # A list of collections the CMS should be able to edit
  - name: "post"
    label: "Actualités"
    label_singular: "Actualité"
    folder: "site/content/post"
    path: "{{slug}}/index"
    create: true
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date de publication", name: "date", widget: "datetime"}
      - {label: "Chapô", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: "pages"
    label: "Pages"
    files:
      - file: "site/content/_index.md"
        label: "Accueil"
        name: "home"
        fields:
          - {label: Titre, name: title, widget: string}
          - {label: Sous-titre, name: subtitle, widget: string}
          - {label: Image de bandeau, name: image, widget: image}
          - {label: "Encart d'introduction", name: blurb, widget: object, fields: [
              {label: "Titre", name: "heading", widget: string},
              {label: "Texte", name: "text", widget: "text"}]}
          - {label: "Mission", name: intro, widget: object, fields: [
              {label: "Titre", name: "heading", widget: string},
              {label: "Texte", name: "text", widget: "text"}]}
          - {label: "Actions mises en avant", name: products, widget: list, fields: [
              {label: "Image", name: "image", widget: "image"},
              {label: "Texte", name: "text", widget: "text"}]}
          - {label: "Objectifs", name: "values", widget: "object", fields: [
              {label: "Titre", name: "heading", widget: string},
              {label: "Texte", name: "text", widget: "text"}]}

      - file: "site/content/qui-sommes-nous.md"
        label: "Qui sommes-nous ?"
        name: "qui-sommes-nous"
        fields:
          - {label: Titre, name: title, widget: string}
          - {label: Sous-titre, name: subtitle, widget: string, required: false}
          - {label: Image de bandeau, name: image, widget: image, required: false}
          - {label: Contenu, name: body, widget: markdown}

      - file: "site/content/nos-actions.md"
        label: "Nos actions"
        name: "nos-actions"
        fields:
          - {label: Titre, name: title, widget: string}
          - {label: Sous-titre, name: subtitle, widget: string, required: false}
          - {label: Image de bandeau, name: image, widget: image, required: false}
          - {label: Contenu, name: body, widget: markdown}

      - file: "site/content/ils-parlent-de-nous.md"
        label: "Ils parlent de nous"
        name: "ils-parlent-de-nous"
        fields:
          - {label: Titre, name: title, widget: string}
          - {label: Sous-titre, name: subtitle, widget: string, required: false}
          - {label: Image de bandeau, name: image, widget: image, required: false}
          - {label: Contenu, name: body, widget: markdown}

      - file: "site/content/contact/_index.md"
        label: "Contact"
        name: "contact"
        fields:
          - {label: Titre, name: title, widget: string}
          - {label: Logo, name: logo, widget: image}
          - {label: Contenu, name: body, widget: markdown}
          - label: Coordonnées
            name: contact_entries
            widget: list
            fields:
              - label: Intitulé
                name: heading
                widget: string
              - label: Texte
                name: text
                widget: text

  - name: "site_settings"
    label: "Réglages du site"
    files:
      - file: "site/data/footer.json"
        label: Pied de page
        name: footer
        fields:
          - {label: Titre, name: title, widget: string}
          - {label: Texte, name: blurb, widget: text}

      - file: "site/hugo.toml"
        label: Configuration Hugo
        name: config
        editor:
          preview: false
        fields:
          - {label: "Titre du site (onglet du navigateur)", name: title, widget: string}
          - label: Params
            name: params
            widget: object
            fields:
              - label: Image Open Graph
                name: images
                widget: list
                field: { label: Image, name: image, widget: image }
